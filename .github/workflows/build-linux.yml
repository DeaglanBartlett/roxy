# Build the sdist and wheel, install the built wheel (not an editable install)
# and run the test suite against it.

name: build-linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint with Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check roxy
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install built wheel
        shell: bash
        run: pip install "$(ls dist/*.whl)[test]"
      - name: Test installed package
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          cd tests
          python -c "import roxy; print(roxy.__file__, roxy.__version__)"
          pytest test_roxy.py
